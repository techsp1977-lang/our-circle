<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Our Circle">
<title>Our Circle</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="oc-icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="oc-apple-touch-icon.png" sizes="180x180">
<!-- Open connections and fetch the app's code in parallel, before it is asked for -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<link rel="preconnect" href="https://securetoken.googleapis.com">
<link rel="modulepreload" href="start.js">
<link rel="modulepreload" href="app.js">
<link rel="modulepreload" href="config.js">
<link rel="modulepreload" href="store.js">
<link rel="modulepreload" href="ui.js">
<link rel="modulepreload" href="dates.js">
<link rel="modulepreload" href="events.js">
<link rel="modulepreload" href="hub.js">
<link rel="modulepreload" href="crop.js">
<link rel="modulepreload" href="lock.js">
<link rel="modulepreload" href="push.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" crossorigin>
<link rel="stylesheet" href="apple-tokens.css">
<link rel="stylesheet" href="app.css">
<!-- The journal's book typeface is loaded in the background by start.js; nothing waits for it -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
<!-- Shown instantly while the app starts: the shape of the Family screen -->
<div class="boot" aria-label="Opening Our Circle" role="status">
  <div class="boot-top"><i class="sk sk-sm"></i><i class="sk sk-lg"></i></div>
  <i class="sk sk-card"></i>
  <i class="sk sk-btn"></i>
  <div class="boot-chart"><i class="sk sk-mine"></i><div><i class="sk sk-hh"></i><i class="sk sk-hh"></i><i class="sk sk-hh"></i></div></div>
</div>
<noscript>This app needs JavaScript turned on.</noscript>
<script type="module" src="start.js"></script>
</body>
</html>
